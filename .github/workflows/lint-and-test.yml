name: Lint and Test Config

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install selene
        run: |
          curl -sSL https://github.com/Kampfkarren/selene/releases/download/0.28.0/selene-0.28.0-linux-x86_64.tar.gz -o selene.tar.gz
          tar -xzf selene.tar.gz
          sudo mv selene /usr/local/bin/

      - name: Install stylua
        run: |
          curl -sSL https://github.com/JohnnyMorganz/StyLua/releases/download/v0.20.0/stylua-0.20.0-linux-x86_64.zip -o stylua.zip
          unzip stylua.zip
          sudo mv stylua /usr/local/bin/

      - name: Run selene (Lua linter)
        run: |
          selene lua/

      - name: Run stylua (Lua formatter check)
        run: |
          stylua --check lua/

  startup:
    name: Test Config Startup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Test Config Loads
        run: |
          nvim --headless -u init.lua -c 'quit'
